nt-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="333.0298" x="97.4346" y="185.0103">[every content change, at most one dump per 300 ms]</text><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="17" id="msg2"><polygon fill="#1A1A1A" points="272.7715,203,282.7715,207,272.7715,211,276.7715,207" style="stroke:#1A1A1A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#1A1A1A;stroke-width:1;" x1="56.2754" x2="278.7715" y1="207" y2="207"/><text fill="#1A1A1A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="204.4961" x="63.2754" y="202.0103">accessibility tree, one IPC per node</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" data-source-line="18" id="msg3"><line style="stroke:#1A1A1A;stroke-width:1;" x1="284.7715" x2="326.7715" y1="234" y2="234"/><line style="stroke:#1A1A1A;stroke-width:1;" x1="326.7715" x2="326.7715" y1="234" y2="247"/><line style="stroke:#1A1A1A;stroke-width:1;" x1="285.7715" x2="326.7715" y1="247" y2="247"/><polygon fill="#1A1A1A" points="295.7715,243,285.7715,247,295.7715,251,291.7715,247" style="stroke:#1A1A1A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#1A1A1A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="196.1553" x="291.7715" y="229.0103">walk it, hashing each node's fields</text></g><path d="M237.052,262 L297.2229,262 L297.2229,267 L287.2229,277 L237.052,277 L237.052,262" fill="#F2F0EE" style="stroke:#B9B4AF;stroke-width:1.5;"/><rect fill="none" height="97" style="stroke:#B9B4AF;stroke-width:1.5;" width="317.7874" x="237.052" y="262"/><text fill="#1A1A1A" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="15.1709" x="252.052" y="273.0103">alt</text><text fill="#1A1A1A" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="221.7427" x="312.2229" y="274.0103">[the hash differs from the last push]</text><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="20" id="msg4"><polygon fill="#C0391B" points="507.7803,292,517.7803,296,507.7803,300,511.7803,296" style="stroke:#C0391B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#C0391B;stroke-width:1;" x1="284.7715" x2="513.7803" y1="296" y2="296"/><text fill="#1A1A1A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="211.0088" x="291.7715" y="291.0103">tree: nodes, windows, truncation flag</text></g><line style="stroke:#B9B4AF;stroke-width:1;stroke-dasharray:2,2;" x1="237.052" x2="554.8394" y1="305" y2="305"/><text fill="#1A1A1A" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="77.9937" x="242.052" y="315.0103">[unchanged]</text><g class="message" data-entity-1="part2" data-entity-2="part2" data-source-line="22" id="msg5"><line style="stroke:#1A1A1A;stroke-width:1;" x1="284.7715" x2="326.7715" y1="338" y2="338"/><line style="stroke:#1A1A1A;stroke-width:1;" x1="326.7715" x2="326.7715" y1="338" y2="351"/><line style="stroke:#1A1A1A;stroke-width:1;" x1="285.7715" x2="326.7715" y1="351" y2="351"/><polygon fill="#1A1A1A" points="295.7715,347,285.7715,351,295.7715,355,291.7715,351" style="stroke:#1A1A1A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#1A1A1A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="179.2324" x="291.7715" y="333.0103">nothing serialized, nothing sent</text></g><?plantuml-src NP8nRnin38Nt-nMlwP35vxh8r0m1uapTYhf0XxQ3BF5EIdIK8F5ikB--b583JRUJ-FZqyV5kyPNOKI67Sn1_ZsTpCXYVJK6EXcLTuhOTHgcd6MF25YxP-c6AwJnMAMIMRLRH844YuT1l0iymgBOGCSGRmPAgn8ksKWKdWVM6Png6Tu5jN1sXoYNIDZId8PiYmOQip-F6v8or4VvacrXAYZSm5OzlLSSIt4nGSQ_ktrOhbHELNZaCmnxZZ_TFkxjF7_U_7d30FRxJyP3i2obNOYOh6wLMT4ynfa5v2INCNf0cjGQ-UKBsYGakc5YHLkse2K70HAwgXFN4nwJaCCuLgdKxQD1jU1qxffH1odHfBmhnDP4D_eQ5xhuk6PaAxdOxBCts4UC3zefih5NFS0mno0MQkhQsbizVdde79qUg